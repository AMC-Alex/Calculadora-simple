<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>simple Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="main-content">
      <div>
        <input type="number" name="" id="numOne" />
        <input type="number" name="" id="numTwo" />
      </div>
      <div class="operations">
        <button id="btnAdd" data-operation="suma">+</button>
        <button id="btnSub" data-operation="resta">-</button>
        <button id="btnMul" data-operation="multiplicacion">*</button>
        <button id="btnDiv" data-operation="division">/</button>
      </div>
      <div>
        <p class="result"></p>
      </div>
      <div>
        <button id="btnClear">Limpiar</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
